; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; 1. Tell PlatformIO we are handling the upload command manually
upload_protocol = stlink

; 2. Call your local STM32CubeProgrammer executable directly to flash the board
upload_command = "D:\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" -c port=SWD -w "$SOURCE" 0x08000000 -v -rst

; Tell PlatformIO to execute a post-build action to make a HEX file
extra_scripts = post:generate_hex.py

build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
